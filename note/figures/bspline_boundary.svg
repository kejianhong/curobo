  <text x="360" y="452" text-anchor="middle" font-size="11.5" fill="#333333">空心点 = 由式 (15)–(17) 从初始状态反解的固定虚结点(§4.5 数值例);t=0 处窗口 [w₀, u₋₃, u₋₂, u₋₁] 精确还原初始位置/速度/加速度且 jerk=0</text>
  <text x="360" y="471" text-anchor="middle" font-size="11.5" fill="#646d72">优化器只更新灰色实心的自由控制点,两端边界条件自动满足,无需等式约束;曲线为均匀三次 B-spline 真实数值计算</text>
  <text x="360" y="490" text-anchor="middle" font-size="11.5" fill="#646d72">示意约定:控制点 cₘ 画在 t=(m−4)·dt_u 处(使虚结点位于 t≤0 侧);B-spline 控制多边形本就不落在曲线上</text>
