<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Roboto, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#646d72"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e76125"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="720" height="480" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333">式 (1)–(9) 优化问题解剖：2-DoF 平面臂搬运 3 kg 负载</text>
  <text x="360" y="52" text-anchor="middle" font-size="13" fill="#646d72">从下垂位形绕过障碍物到侧方目标位姿；橙色为中间时刻 θ_t 的位形（数值见正文例子）</text>

  <!-- 重力方向 -->
  <line x1="95" y1="110" x2="95" y2="155" stroke="#646d72" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="104" y="136" font-size="13" fill="#646d72">g</text>

  <!-- 基座 -->
  <text x="172" y="200" text-anchor="end" font-size="12.5" fill="#646d72">基座</text>

  <!-- 末端轨迹 (EE path, 式1) -->
  <path d="M 185 345 Q 252 336 284 301 Q 313 267 317 200 Q 316.5 175 310 163" fill="none" stroke="#e76125" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-orange)"/>

  <!-- 障碍物 (式4) -->
  <circle cx="249" cy="255" r="14" fill="#ececec" stroke="#646d72" stroke-width="1.8"/>
  <text x="242" y="292" text-anchor="middle" font-size="12" fill="#646d72">障碍物（式 4）</text>
  <text x="242" y="307" text-anchor="middle" font-size="12" fill="#646d72">C_scene ≤ 0</text>

  <!-- 起点位形 θ0 (浅灰, 下垂) -->
  <line x1="185" y1="205" x2="185" y2="285" stroke="#b0b6b9" stroke-width="6" stroke-linecap="round"/>
  <line x1="185" y1="285" x2="185" y2="345" stroke="#b0b6b9" stroke-width="5" stroke-linecap="round"/>
  <circle cx="185" cy="285" r="4.5" fill="#ffffff" stroke="#b0b6b9" stroke-width="2"/>
  <text x="185" y="366" text-anchor="middle" font-size="12.5" fill="#646d72">起点 θ₀ = (−90°, 0°)</text>

  <!-- 终点位形 θT (深灰) -->
  <line x1="185" y1="205" x2="263.8" y2="191.1" stroke="#646d72" stroke-width="6" stroke-linecap="round"/>
  <line x1="263.8" y1="191.1" x2="306.2" y2="148.7" stroke="#646d72" stroke-width="5" stroke-linecap="round"/>
  <circle cx="263.8" cy="191.1" r="4.5" fill="#ffffff" stroke="#646d72" stroke-width="2"/>
  <text x="248" y="180" text-anchor="end" font-size="12.5" fill="#646d72">θ_T</text>

  <!-- 中间位形 θt (橙) -->
  <line x1="185" y1="205" x2="262.3" y2="225.7" stroke="#e76125" stroke-width="6" stroke-linecap="round"/>
  <line x1="262.3" y1="225.7" x2="316.7" y2="200.3" stroke="#e76125" stroke-width="5" stroke-linecap="round"/>
  <circle cx="262.3" cy="225.7" r="4.5" fill="#ffffff" stroke="#e76125" stroke-width="2"/>
  <text x="271" y="243" font-size="12.5" fill="#e76125">θ_t（式 2）</text>

  <!-- 负载 (橙方块, 在 θt 末端) -->
  <rect x="310.7" y="194.3" width="12" height="12" fill="#e76125"/>
  <text x="331" y="207" font-size="12.5" fill="#333333">3 kg 负载</text>

  <!-- 基座关节 (画在连杆之上) -->
  <circle cx="185" cy="205" r="6" fill="#ffffff" stroke="#333333" stroke-width="2.2"/>

  <!-- 目标球 ηm (式6) 与终端静止 (式9) -->
  <circle cx="306.2" cy="148.7" r="11" fill="none" stroke="#e76125" stroke-width="1.8" stroke-dasharray="4 3"/>
  <circle cx="306.2" cy="148.7" r="3" fill="#333333"/>
  <text x="306" y="126" text-anchor="middle" font-size="12.5" fill="#333333">终端静止（式 9）：θ′_T = θ″_T = 0</text>
  <text x="324" y="153" font-size="12.5" fill="#e76125">目标球 η_m（式 6）</text>

  <!-- 式(1) 代价标注 (带引出线) -->
  <line x1="309" y1="277" x2="348" y2="318" stroke="#b0b6b9" stroke-width="1.2"/>
  <text x="352" y="326" font-size="12.5" fill="#e76125">轨迹代价（式 1）：smooth + length + energy</text>

  <!-- 力矩面板 (式7/8) -->
  <text x="575" y="102" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333333">式 (7)(8)：InvDyn 力矩 vs 上限</text>

  <text x="480" y="128" font-size="12" fill="#333333">肩关节 τ₁ = 41.5 N·m（94%）</text>
  <rect x="480" y="134" width="160" height="16" fill="#ececec"/>
  <rect x="480" y="134" width="151" height="16" fill="#e76125"/>
  <line x1="556.8" y1="131" x2="556.8" y2="153" stroke="#646d72" stroke-width="2"/>
  <line x1="640" y1="129" x2="640" y2="155" stroke="#d21419" stroke-width="2.5"/>
  <text x="648" y="147" font-size="11.5" fill="#d21419">τ₁⁺ = 44</text>

  <text x="480" y="183" font-size="12" fill="#333333">肘关节 τ₂ = 12.2 N·m（94%）</text>
  <rect x="480" y="189" width="160" height="16" fill="#ececec"/>
  <rect x="480" y="189" width="150.4" height="16" fill="#e76125"/>
  <line x1="524.2" y1="186" x2="524.2" y2="208" stroke="#646d72" stroke-width="2"/>
  <line x1="640" y1="184" x2="640" y2="210" stroke="#d21419" stroke-width="2.5"/>
  <text x="648" y="202" font-size="11.5" fill="#d21419">τ₂⁺ = 13</text>

  <line x1="483" y1="224" x2="483" y2="236" stroke="#646d72" stroke-width="2"/>
  <text x="492" y="234" font-size="11.5" fill="#646d72">灰刻度 = 无负载时（21.1 / 3.6 N·m）</text>
  <text x="480" y="256" font-size="11.5" fill="#d21419">负载重力矩 m·g·x ≈ 19.4 N·m，逼近饱和</text>

  <!-- 底部注释 -->
  <text x="360" y="428" text-anchor="middle" font-size="12" fill="#646d72">式 (3)：θ′_t = (1.2, −0.6) rad/s 在 ±2.0 内；式 (4)：肘部球 ESDF 距离 d = 0.091 m ＞ r + ε = 0.07 m，无碰撞但梯度已激活</text>
  <text x="360" y="448" text-anchor="middle" font-size="12" fill="#646d72">式 (5)：自碰撞余量 0.23 m；力矩由式 (7) RNEA 逆动力学算出，式 (8) 把守执行器上限——避免"时间最优"轨迹的可行性鸿沟</text>
  <text x="360" y="468" text-anchor="middle" font-size="12" fill="#646d72">几何按真实比例绘制（1 m = 200 px）；θ_t 时刻手臂近乎水平，重力力矩最大，3 kg 负载使两关节均达上限的 94%</text>
</svg>
