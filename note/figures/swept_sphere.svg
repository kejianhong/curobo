<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="Roboto, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#646d72"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d21419"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e76125"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="720" height="520" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333">swept-sphere 碰撞代价：扫掠采样 + activation 带 + CHOMP speed metric</text>
  <text x="360" y="49" text-anchor="middle" font-size="12.5" fill="#646d72">每个 (球, 时刻, 障碍物) 一个 GPU 线程;沿球心连线 sphere-marching，只扫到中点</text>

  <!-- ESDF 等值线(由外向内) -->
  <circle cx="370" cy="350" r="160" fill="none" stroke="#b0b6b9" stroke-width="1.3" stroke-dasharray="5 5"/>
  <circle cx="370" cy="350" r="128" fill="none" stroke="#b0b6b9" stroke-width="1.3" stroke-dasharray="5 5"/>
  <text x="524" y="422" font-size="11.5" fill="#8a9296">φ = +8 cm</text>
  <text x="450" y="452" font-size="11.5" fill="#8a9296">φ = +4.8 cm</text>

  <!-- activation 带(障碍表面外 η) -->
  <circle cx="370" cy="350" r="93" fill="none" stroke="#e76125" stroke-width="26" opacity="0.16"/>
  <circle cx="370" cy="350" r="106" fill="none" stroke="#e76125" stroke-width="1.4" stroke-dasharray="3 4"/>
  <text x="238" y="424" text-anchor="end" font-size="12.5" font-weight="bold" fill="#e76125">activation 带(宽 η)</text>
  <text x="238" y="440" text-anchor="end" font-size="11.5" fill="#e76125">未接触已产生排斥，代价二次软启动</text>
  <line x1="243" y1="426" x2="283" y2="408" stroke="#e76125" stroke-width="1" opacity="0.6"/>

  <!-- 障碍物 -->
  <circle cx="370" cy="350" r="80" fill="#ececec" stroke="#333333" stroke-width="2"/>
  <text x="370" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#646d72">障碍物</text>
  <text x="370" y="366" text-anchor="middle" font-size="11.5" fill="#646d72">(ESDF：内部 φ &lt; 0)</text>

  <!-- 扫掠胶囊(swept volume 近似) -->
  <line x1="200" y1="163" x2="540" y2="163" stroke="#e76125" stroke-width="62" stroke-linecap="round" opacity="0.10"/>

  <!-- 球心连线 -->
  <line x1="200" y1="163" x2="540" y2="163" stroke="#646d72" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- 中点分界 -->
  <line x1="370" y1="140" x2="370" y2="186" stroke="#646d72" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="370" y="205" text-anchor="middle" font-size="11.5" fill="#646d72">half_dist(中点)：两侧各归本时刻 / 邻居时刻负责</text>

  <!-- 时刻 h 的球 -->
  <circle cx="200" cy="163" r="31" fill="#ffffff" stroke="#646d72" stroke-width="2.4"/>
  <circle cx="200" cy="163" r="3.4" fill="#333333"/>
  <text x="200" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">x_h(时刻 h)</text>

  <!-- 时刻 h+1 的球 -->
  <circle cx="540" cy="163" r="31" fill="#ffffff" stroke="#646d72" stroke-width="2.4"/>
  <circle cx="540" cy="163" r="3.4" fill="#333333"/>
  <text x="540" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">x_h+1(时刻 h+1)</text>

  <!-- 插值球(sweep 采样处的虚影) -->
  <circle cx="336" cy="163" r="31" fill="none" stroke="#e76125" stroke-width="1.6" stroke-dasharray="4 4"/>

  <!-- sweep 采样点:自由区大步,靠近障碍变密 -->
  <circle cx="290" cy="163" r="4" fill="#e76125"/>
  <circle cx="336" cy="163" r="4" fill="#e76125"/>
  <circle cx="450" cy="163" r="4" fill="#e76125"/>
  <circle cx="404" cy="163" r="4" fill="#e76125"/>

  <!-- 自适应步长注释 -->
  <path d="M 204 186 Q 245 208 286 186" fill="none" stroke="#646d72" stroke-width="1.1"/>
  <text x="245" y="228" text-anchor="middle" font-size="11.5" fill="#646d72">自由区：步长 = max(−p, r+η)</text>
  <text x="245" y="243" text-anchor="middle" font-size="11.5" fill="#646d72">ESDF 保证这段内无碰撞，安全跳过</text>
  <path d="M 294 186 Q 313 200 332 186" fill="none" stroke="#646d72" stroke-width="1.1"/>
  <text x="529" y="228" text-anchor="middle" font-size="11.5" fill="#646d72">接触区：步长 = 穿透深度 p</text>
  <text x="529" y="243" text-anchor="middle" font-size="11.5" fill="#646d72">浅穿透自动加密采样</text>
  <path d="M 408 186 Q 427 200 446 186" fill="none" stroke="#646d72" stroke-width="1.1"/>
  <line x1="440" y1="198" x2="500" y2="220" stroke="#646d72" stroke-width="1" opacity="0.6"/>

  <!-- 速度箭头 -->
  <line x1="565" y1="140" x2="640" y2="140" stroke="#e76125" stroke-width="2.6" marker-end="url(#arrow-orange)"/>
  <text x="602" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#e76125">ẋ(球心速度)</text>

  <!-- 梯度箭头:未缩放(灰) vs ×‖ẋ‖(红) -->
  <line x1="336" y1="128" x2="336" y2="88" stroke="#646d72" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="326" y="97" text-anchor="end" font-size="12" fill="#646d72">−∂c/∂x(慢速)</text>
  <line x1="404" y1="128" x2="404" y2="60" stroke="#d21419" stroke-width="3.4" marker-end="url(#arrow-red)"/>
  <text x="416" y="72" font-size="12.5" font-weight="bold" fill="#d21419">× ‖ẋ‖(快速经过 → 推力更强)</text>
  <text x="416" y="88" font-size="11.5" fill="#d21419">且只保留 ⊥ ẋ 的分量(P = I − v̂v̂ᵀ)</text>

  <!-- 底部注释 -->
  <text x="360" y="478" text-anchor="middle" font-size="12.5" fill="#333333">代价：p = (r+η) − φ;0 &lt; p ≤ η 二次段 p²/2η(缓冲带软启动)，p &gt; η 线性段 p − η/2(真穿透，梯度饱和)</text>
  <text x="360" y="497" text-anchor="middle" font-size="12" fill="#646d72">speed metric：c̃ = ‖ẋ‖c，g̃ = ‖ẋ‖[P∇c − cκ] —— 弧长积分 ∫c‖ẋ‖dt 的泛函梯度，冲得越快罚得越重，只能空间绕行</text>
  <text x="360" y="514" text-anchor="middle" font-size="11.5" fill="#8a9296">wp_sweep_collision_kernel.py(SWEEP_STEPS = 3/方向)· wp_collision_common.py(activation)· wp_speed_metric.py(CHOMP)</text>
</svg>
