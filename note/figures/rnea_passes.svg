<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Roboto, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e76125"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d21419"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333">RNEA 三趟(Algorithm 4)与树层级并行</text>
  <text x="360" y="52" text-anchor="middle" font-size="12.5" fill="#646d72">5-link 示例树(L1 下分叉出 L2 与 L4);§6.3 的单摆例子 = 只有 L0 的退化情形</text>

  <!-- 层级条带 -->
  <rect x="35" y="125" width="575" height="30" fill="#ececec" opacity="0.55"/>
  <rect x="35" y="245" width="575" height="30" fill="#ececec" opacity="0.55"/>

  <!-- 右侧层级标注 -->
  <text x="662" y="144" text-anchor="middle" font-size="11.5" fill="#333333">level 0</text>
  <text x="662" y="174" text-anchor="middle" font-size="10" font-style="italic" fill="#b0b6b9">__syncwarp</text>
  <text x="662" y="204" text-anchor="middle" font-size="11.5" fill="#333333">level 1</text>
  <text x="662" y="234" text-anchor="middle" font-size="10" font-style="italic" fill="#b0b6b9">__syncwarp</text>
  <text x="662" y="258" text-anchor="middle" font-size="11.5" fill="#333333">level 2</text>
  <text x="662" y="272" text-anchor="middle" font-size="10.5" fill="#e76125">2 link ∥ 2 线程</text>
  <text x="662" y="294" text-anchor="middle" font-size="10" font-style="italic" fill="#b0b6b9">__syncwarp</text>
  <text x="662" y="324" text-anchor="middle" font-size="11.5" fill="#333333">level 3</text>

  <!-- ============ Pass 1 ============ -->
  <text x="115" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#e76125">Pass 1:v, a 向下</text>
  <line x1="115" y1="155" x2="115" y2="185" stroke="#e76125" stroke-width="2.4" marker-end="url(#arrow-orange)"/>
  <line x1="106.7" y1="212.5" x2="83.3" y2="247.5" stroke="#e76125" stroke-width="2.4" marker-end="url(#arrow-orange)"/>
  <line x1="123.3" y1="212.5" x2="146.7" y2="247.5" stroke="#e76125" stroke-width="2.4" marker-end="url(#arrow-orange)"/>
  <line x1="75" y1="275" x2="75" y2="305" stroke="#e76125" stroke-width="2.4" marker-end="url(#arrow-orange)"/>
  <g fill="#ffffff" stroke="#646d72" stroke-width="1.8">
    <circle cx="115" cy="140" r="15"/>
    <circle cx="115" cy="200" r="15"/>
    <circle cx="75" cy="260" r="15"/>
    <circle cx="155" cy="260" r="15"/>
    <circle cx="75" cy="320" r="15"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#333333">
    <text x="115" y="144">L0</text>
    <text x="115" y="204">L1</text>
    <text x="75" y="264">L2</text>
    <text x="155" y="264">L4</text>
    <text x="75" y="324">L3</text>
  </g>
  <text x="115" y="352" text-anchor="middle" font-size="10.5" fill="#646d72">根注入重力:a₀ = [0; −g_vec]</text>
  <text x="115" y="367" text-anchor="middle" font-size="10.5" fill="#646d72">v = Xv_pa + Sq̇;a 含 Coriolis 项</text>

  <!-- ============ Pass 2 ============ -->
  <text x="320" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#646d72">Pass 2:f = Ia + v×*(Iv)</text>
  <g stroke="#b0b6b9" stroke-width="1.4">
    <line x1="320" y1="155" x2="320" y2="185"/>
    <line x1="311.7" y1="212.5" x2="288.3" y2="247.5"/>
    <line x1="328.3" y1="212.5" x2="351.7" y2="247.5"/>
    <line x1="280" y1="275" x2="280" y2="305"/>
  </g>
  <g fill="#646d72">
    <circle cx="320" cy="140" r="15"/>
    <circle cx="320" cy="200" r="15"/>
    <circle cx="280" cy="260" r="15"/>
    <circle cx="360" cy="260" r="15"/>
    <circle cx="280" cy="320" r="15"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#ffffff">
    <text x="320" y="144">L0</text>
    <text x="320" y="204">L1</text>
    <text x="280" y="264">L2</text>
    <text x="360" y="264">L4</text>
    <text x="280" y="324">L3</text>
  </g>
  <text x="320" y="352" text-anchor="middle" font-size="10.5" fill="#646d72">无树依赖 → 全部 link 完全并行</text>
  <text x="320" y="367" text-anchor="middle" font-size="10.5" fill="#646d72">缓存 {v,a,f}:20 floats/link → 反向复用</text>

  <!-- ============ Pass 3 ============ -->
  <text x="525" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#d21419">Pass 3:τ, f_pa 向上聚合</text>
  <line x1="525" y1="185" x2="525" y2="155" stroke="#d21419" stroke-width="2.4" marker-end="url(#arrow-red)"/>
  <line x1="493.3" y1="247.5" x2="516.7" y2="212.5" stroke="#d21419" stroke-width="2.4" marker-end="url(#arrow-red)"/>
  <line x1="556.7" y1="247.5" x2="533.3" y2="212.5" stroke="#d21419" stroke-width="2.4" marker-end="url(#arrow-red)"/>
  <line x1="485" y1="305" x2="485" y2="275" stroke="#d21419" stroke-width="2.4" marker-end="url(#arrow-red)"/>
  <g fill="#ffffff" stroke="#646d72" stroke-width="1.8">
    <circle cx="525" cy="140" r="15"/>
    <circle cx="525" cy="200" r="15"/>
    <circle cx="485" cy="260" r="15"/>
    <circle cx="565" cy="260" r="15"/>
    <circle cx="485" cy="320" r="15"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#333333">
    <text x="525" y="144">L0</text>
    <text x="525" y="204">L1</text>
    <text x="485" y="264">L2</text>
    <text x="565" y="264">L4</text>
    <text x="485" y="324">L3</text>
  </g>
  <text x="525" y="352" text-anchor="middle" font-size="10.5" fill="#646d72">τ_j += m·Sᵀf(mimic 累加)</text>
  <text x="525" y="367" text-anchor="middle" font-size="10.5" fill="#646d72">f_pa += Xᵀf(同层多子链 atomicAdd)</text>

  <!-- 底部注释 -->
  <text x="360" y="404" text-anchor="middle" font-size="12" fill="#646d72">同层 link 无父子依赖:for (idx = start + worker; idx &lt; end; idx += TPB) —— warp 内 TPB 个线程分担同层(如 level 2 的 L2、L4)</text>
  <text x="360" y="422" text-anchor="middle" font-size="12" fill="#646d72">单摆例(仅 L0):v₁=[(0,0,1);0],a₁=[(0,0,2);(4.905,8.496,0)],f₁=[(0,0,2.7425);(10.81,17.49,0)],τ = 2.7425 N·m</text>
</svg>
